<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS LEGENDS | TRANSFER MARKET RESULTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050a0f; color: white; font-family: sans-serif; }
        .market-card {
            background: linear-gradient(145deg, #0f172a 0%, #020617 100%);
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 1.5rem;
        }
        .neon-border-cyan { border-left: 4px solid #00e5ff; }
        .neon-border-yellow { border-left: 4px solid #eaff00; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col items-center mb-12 text-center">
            <h1 class="text-4xl font-black italic text-cyan-400 uppercase tracking-tighter">Transfer Market <span class="text-white">Live Feed</span></h1>
            <p class="text-gray-500 text-xs uppercase tracking-widest mt-2">Official Auction Results - Nexus Legends Season 2026-27</p>
            <div class="h-1 w-24 bg-cyan-500 mt-4 rounded-full"></div>
        </div>

        <!-- RECENT SIGNINGS GRID -->
        <h3 class="text-sm font-bold uppercase mb-6 text-gray-400"><i class="fa-solid fa-bolt text-yellow-400 mr-2"></i> Most Recent Signings</h3>
        <div id="signingsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading State -->
            <div class="col-span-full text-center py-20 text-gray-600 animate-pulse uppercase text-xs font-bold tracking-widest">
                Syncing with Nexus Auction Core...
            </div>
        </div>
    </div>

    <script>
        const AUCTION_BACKEND = "https://nexus-acl-backend.onrender.com"; // Change to your real backend URL
        const API_KEY = "NEXUS_SECRET_789"; // Must match what we set in server.js

        async function fetchMarketResults() {
            try {
                const response = await fetch(`${AUCTION_BACKEND}/api/export-results`, {
                    headers: { 'x-api-key': API_KEY }
                });
                const data = await response.json();
                renderSignings(data.players);
            } catch (err) {
                document.getElementById('signingsGrid').innerHTML = `<p class="text-red-500">Failed to connect to Nexus Link.</p>`;
            }
        }

        function renderSignings(players) {
            const grid = document.getElementById('signingsGrid');
            // Only show SOLD players, latest first
            const soldPlayers = players.filter(p => p.status === 'Sold').reverse();

            if (soldPlayers.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 py-10 col-span-full text-center">Market is open. Awaiting first signing...</p>`;
                return;
            }

            grid.innerHTML = soldPlayers.map(p => `
                <div class="market-card p-5 ${p.tier === 'BIG TIME' ? 'neon-border-yellow' : 'neon-border-cyan'} shadow-xl">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[10px] font-black px-3 py-1 rounded-full bg-cyan-500/10 text-cyan-400 uppercase">${p.tier}</span>
                        <span class="text-yellow-500 font-bold text-sm">★ ${p.strength}</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <img src="${p.image || 'https://via.placeholder.com/100'}" class="w-16 h-16 rounded-xl object-cover border border-white/5 bg-gray-900">
                        <div>
                            <h4 class="text-lg font-black uppercase italic leading-none mb-1">${p.name}</h4>
                            <p class="text-[10px] text-gray-500 uppercase font-bold">Sold to: <span class="text-white">${p.assigned_to}</span></p>
                        </div>
                    </div>
                    <div class="mt-4 pt-4 border-t border-white/5 flex justify-between items-center">
                        <span class="text-[9px] text-gray-600 uppercase font-black tracking-tighter">Transfer Fee</span>
                        <span class="text-xl font-black text-white">${p.transfer_fee}M</span>
                    </div>
                </div>
            `).join('');
        }

        // Auto-refresh every 60 seconds
        fetchMarketResults();
        setInterval(fetchMarketResults, 60000);
    </script>
</body>
</html>
