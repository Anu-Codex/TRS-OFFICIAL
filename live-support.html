<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Support | AI Bot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --bg: #020617; --card: #0f172a; --accent: #10b981; --border: #1e293b; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        .chat-header { 
            padding: 20px; background: var(--card); border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; gap: 15px; 
        }
        .bot-status { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); }

        /* Chat Area */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { max-width: 85%; padding: 12px 18px; border-radius: 15px; font-size: 0.9rem; line-height: 1.4; position: relative; }
        .bot-msg { 
            align-self: flex-start; background: var(--card); border: 1px solid var(--border); 
            border-left: 4px solid var(--accent); color: #cbd5e1; 
        }
        .user-msg { 
            align-self: flex-end; background: var(--accent); color: black; font-weight: 600; 
        }

        /* Input Area */
        .input-area { 
            padding: 20px; background: var(--card); border-top: 1px solid var(--border); 
            display: flex; gap: 10px; align-items: center;
        }
        #userInput { 
            flex: 1; background: #020617; border: 1px solid var(--border); 
            padding: 12px; border-radius: 10px; color: white; outline: none;
        }
        .send-btn { 
            background: var(--accent); border: none; padding: 12px 20px; 
            border-radius: 10px; cursor: pointer; font-weight: bold; 
        }

        /* Typing Animation */
        .typing { font-size: 0.7rem; color: var(--accent); display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="chat-header">
        <a href="index.html" style="color:white;"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="bot-status"></div>
        <div>
            <div style="font-weight: 800; font-size: 0.9rem; letter-spacing: 1px;">NEXUS AI BOT</div>
            <div style="font-size: 0.6rem; color: var(--accent);">CONNECTED TO DATABASE V7.0</div>
        </div>
    </div>

    <div id="chat-window">
        <div class="msg bot-msg">System Initialized. I am the Nexus Support Bot. Ask me about Player Stats, Market Values, or Leaderboards.</div>
    </div>

    <div style="padding: 0 20px;"><div id="typing" class="typing">Bot is querying database...</div></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask Nexus Bot..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <script>
    const API = "https://nexus-database-v2.onrender.com";
    const chatWindow = document.getElementById('chat-window');
    const typingIndicator = document.getElementById('typing');

    function appendMessage(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}-msg`;
        div.innerText = text;
        chatWindow.appendChild(div);
        
        // Auto-scroll to bottom
        chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const msg = input.value.trim();
        
        if(!msg) return;

        // Display user message
        appendMessage(msg, 'user');
        input.value = "";
        
        // Show AI is thinking
        typingIndicator.style.display = 'block';
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const res = await fetch(`${API}/api/bot/groq-query`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: msg })
            });
            
            const data = await res.json();
            
            // Small delay for professional feel
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                appendMessage(data.reply, 'bot');
            }, 300);

        } catch (e) {
            typingIndicator.style.display = 'none';
            appendMessage("SYSTEM OVERLOAD: Connection to Groq AI failed. Check backend logs.", 'bot');
        }
    }

    // Handle initial greeting
    window.onload = () => {
        setTimeout(() => {
            appendMessage("Neural Link Established. I have full access to the Nexus Database. How can I assist your career today?", "bot");
        }, 500);
    };
    </script>
</body>
</html>
