<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Tamil Efootballers</title>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* CSS STYLES */
        :root {
            --bg-color: #060b13;
            --card-bg: #101926;
            --input-bg: #060b13;
            --accent-green: #10b981;
            --accent-hover: #34d399;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --border-color: #1e293b;
            --error-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Back Button */
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .back-home:hover {
            color: var(--accent-green);
        }

        /* Login Card */
        .login-card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 28px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-logo {
            width: 65px;
            height: 65px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .login-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 35px;
        }

        /* Form Controls */
        .input-group {
            text-align: left;
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #475569;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            padding: 14px 14px 14px 48px;
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.03);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .input-wrapper input:focus + i, 
        .input-wrapper input:not(:placeholder-shown) + i {
            color: var(--accent-green);
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            background: var(--accent-green);
            color: #060b13;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .login-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.25);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: var(--error-red);
            font-size: 0.85rem;
            margin-top: 20px;
            min-height: 20px;
            font-weight: 500;
        }

        .footer-text {
            margin-top: 30px;
            color: #475569;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Back Button -->
        <a href="index.html" class="back-home">
            <i class="fa-solid fa-chevron-left"></i> Back to Live Site
        </a>

        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h1>Admin Login</h1>
                <p>Manage your players and league stats</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Admin Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="admin@tamil.com" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Security Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Sign In to Dashboard <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <p id="error-msg" class="error-message"></p>
        </div>
        
        <p class="footer-text">Tamil Efootballers &bull; League Management System</p>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('error-msg');

            // Replace with your actual Render backend URL
            const API_URL = "https://pes-park-backend.onrender.com/api/login";

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('isAdmin', 'true');
                    window.location.href = 'dashboard.html';
                } else {
                    errorElement.innerText = "Invalid email or password. Please try again.";
                }
            } catch (err) {
                errorElement.innerText = "Connection error. Is the backend running?";
            }
        };
    </script>
</body>
</html>
