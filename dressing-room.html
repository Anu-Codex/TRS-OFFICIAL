<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dressing Room | NEXUS LEGENDS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --bg: #020617;
            --panel: #0f172a;
            --accent: #10b981;
            --gold: #f59e0b;
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, #020617 80%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- TOP NAVIGATION --- */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            border: 1px solid var(--danger);
            transition: 0.3s;
        }

        .logout-btn:hover { background: var(--danger); color: white; }

        /* --- HERO SECTION --- */
        .hero {
            display: flex;
            align-items: center;
            gap: 25px;
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.1) 0%, transparent 100%);
            padding: 30px;
            border-radius: 20px;
            border-left: 4px solid var(--accent);
            margin-bottom: 30px;
        }

        .t-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.4));
            background: var(--panel);
            padding: 10px;
            border-radius: 50%;
            border: 2px solid var(--border);
        }

        .hero-text h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero-text p {
            color: var(--text-dim);
            margin: 5px 0 0 0;
            font-weight: 500;
        }

        /* --- STATS GRID --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--panel);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent);
        }

        .stat-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.8rem; font-weight: 900; color: var(--text-main); font-family: 'Orbitron', sans-serif; }
        .stat-value span { font-size: 1rem; color: var(--accent); margin-left: 5px; }

        /* --- MAIN LAYOUT SPACING --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

        /* --- PANELS --- */
        .panel {
            background: var(--panel);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 25px;
            margin-bottom: 25px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .panel-header i { color: var(--accent); }
        .panel-header h3 { margin: 0; font-family: 'Orbitron'; font-size: 1rem; letter-spacing: 1px; }

        /* --- TABLE STYLE --- */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; padding: 10px; border-bottom: 2px solid var(--border); }
        td { padding: 15px 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .p-name { font-weight: 700; color: var(--text-main); }
        .p-price { color: var(--gold); font-family: 'Orbitron'; font-size: 0.8rem; }
        .p-mv { color: var(--accent); font-family: 'Orbitron'; font-size: 0.8rem; }

        /* --- FORM ELEMENTS --- */
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; }
        input, select {
            width: 100%;
            padding: 12px;
            background: #020617;
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
            outline: none;
            font-family: 'Rajdhani';
            transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }

        .btn-publish {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #020617;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            font-family: 'Orbitron';
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-publish:hover { background: #059669; transform: translateY(-2px); }

        /* --- OFFERS LIST --- */
        .offer-card {
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid var(--gold);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .offer-card b { color: var(--gold); }
        .accept-btn {
            width: 100%; margin-top: 10px; background: var(--gold); color: #000;
            border: none; padding: 10px; border-radius: 6px; font-weight: 800;
            cursor: pointer; font-family: 'Orbitron'; font-size: 0.7rem;
        }
    </style>
</head>

    <script>
        const API = "https://pes-park-backend.onrender.com";
        const urlParams = new URLSearchParams(window.location.search);
        const teamName = urlParams.get('id');
        const captainData = JSON.parse(localStorage.getItem('activeCaptainTeam'));

        setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; }, 3000);

        async function init() {
    if (!captainData || teamName !== captainData.teamName) {
        window.location.href = 'captain-login.html';
        return;
    }

    // 1. Instant Load from Cache
    const cachedData = localStorage.getItem(`cache_${teamName}`);
    if (cachedData) {
        renderUI(JSON.parse(cachedData));
        document.getElementById('loading-overlay').style.display = 'none';
        
    }

    try {
        // 2. Single "Mega" Fetch
        const res = await fetch(`${API}/api/v2/dressing-room/${encodeURIComponent(teamName)}`);
        const data = await res.json();

        // 3. Save to cache for next time
        localStorage.setItem(`cache_${teamName}`, JSON.stringify(data));

        // 4. Update UI with fresh data
        renderUI(data);
        
    } catch (e) {
        console.error("Sync failed, using offline data");
    } finally {
        document.getElementById('loading-overlay').style.display = 'none';
        
    }
}

// Move all your UI logic into this single function
function renderUI(data) {
    // 1. Set Header/Hero
    document.getElementById('displayName').innerText = data.team.name + " COMMAND";
    document.getElementById('tPurse').innerHTML = (data.team.budget || 0) + "<span>M</span>";
    if(data.team.logoUrl) document.getElementById('tLogo').src = data.team.logoUrl;

    // 2. Set Stats
    document.getElementById('squadCount').innerHTML = data.players.length + "<span>Players</span>";

    // 3. Squad Table & Total Investment calculation
    let totalSpent = 0;
    document.getElementById('squadDisplay').innerHTML = data.players.map(p => {
        const price = p.soldTo.match(/\d+/) ? p.soldTo.match(/\d+/)[0] : 0;
        totalSpent += parseInt(price);
        return `<tr style="border-bottom:1px solid var(--border)">
            <td class="p-name">${p.name}</td>
            <td class="p-price">${price}M</td>
            <td class="p-mv">${p.marketValue || 0}M</td>
        </tr>`;
    }).join('');
    document.getElementById('totalInvestment').innerHTML = totalSpent + "<span>M</span>";

    // 4. Populate "My Player" Dropdowns (Used in Transfer AND Trade tabs)
    const myPlayersHTML = data.players.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
    document.getElementById('playerList').innerHTML = myPlayersHTML;      // For Transfer
    document.getElementById('myTradePlayer').innerHTML = myPlayersHTML;  // For Trade

    // 5. Populate Team Dropdowns (Transfer Target vs Trade Target)
    const teamsHTML = data.allTeams.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
    
    // Transfer Dropdown (Always includes Public Market)
    document.getElementById('targetTeam').innerHTML = '<option value="General">Public Market (Everyone)</option>' + teamsHTML;
    
    // Trade Dropdown (Initial state)
    document.getElementById('tradeTargetTeam').innerHTML = '<option value="">Select Team to Trade With...</option>' + teamsHTML;
    
    // Clear the "Target Trade Player" dropdown until a team is selected
    document.getElementById('targetTradePlayer').innerHTML = '<option>Select Team Above First...</option>';

    // 6. Handle Incoming Offers (Modified to handle both Transfer and Trade)
    const offersBox = document.getElementById('offersBox');
    if(data.offers && data.offers.length > 0) {
        offersBox.style.display = 'block';
        document.getElementById('incomingOffersList').innerHTML = data.offers.map(o => {
            if (o.type === "TRADE") {
                // If the offer is a TRADE swap proposal
                return `
                <div class="offer-card" style="border-left: 4px solid var(--gold); background: rgba(245, 158, 11, 0.05); padding:15px; margin-bottom:10px; border-radius:12px;">
                    <div style="font-size:0.75rem; color:var(--gold); font-weight:bold;">TRADE PROPOSAL</div>
                    <div style="font-size:0.9rem; margin:5px 0;"><b>${o.fromTeam}</b> wants to swap <b>${o.playerName}</b> for your <b>${o.tradePlayerWanted}</b></div>
                    <div style="font-size:0.75rem; color:var(--text-dim);">Cash Offer: ${o.releaseFee}M</div>
                    <button class="accept-btn" style="background:var(--gold); color:black; width:100%; margin-top:10px; padding:8px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="acceptTrade('${o._id}')">CONFIRM SWAP</button>
                </div>`;
            } else {
                // If the offer is a regular TRANSFER listing
                return `
                <div class="offer-card" style="padding:15px; border:1px solid var(--border); margin-bottom:10px; border-radius:12px; background:rgba(255,255,255,0.02)">
                    <div style="font-size:0.8rem; margin-bottom:5px;"><b>${o.fromTeam}</b> sent offer for:</div>
                    <div style="font-weight:700; font-size:1.1rem; color:white;">${o.playerName}</div>
                    <div style="font-size:0.7rem; color:var(--text-dim); margin-top:5px;">Fee: ${o.releaseFee}M</div>
                    <button class="accept-btn" style="width:100%; background:var(--accent); color:black; margin-top:10px; padding:8px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="acceptOffer('${o._id}')">CONFIRM SIGNING (${o.releaseFee}M)</button>
                </div>`;
            }
        }).join('');
    } else {
        offersBox.style.display = 'none';
    }
}

        async function loadOffers() {
    const res = await fetch(`${API}/api/market/listings`);
    const list = await res.json();
    const myOffers = list.filter(l => l.targetTeam === teamName || (l.targetTeam === "General" && l.fromTeam !== teamName));

    if (myOffers.length > 0) {
        document.getElementById('offersBox').style.display = 'block';
        document.getElementById('incomingOffersList').innerHTML = myOffers.map(o => {
            // IF THE OFFER IS A TRADE SWAP
            if (o.type === "TRADE") {
                return `
                <div class="offer-card" style="border-left: 4px solid var(--gold); background: rgba(245, 158, 11, 0.05);">
                    <div style="font-size:0.8rem; margin-bottom:5px;"><b style="color:var(--gold)">TRADE PROPOSAL</b> from ${o.fromTeam}</div>
                    <div style="font-weight:700; font-size:1rem; color:white;">
                        Gives You: ${o.playerName} <br>
                        Wants Your: ${o.tradePlayerWanted}
                    </div>
                    <div style="font-size:0.7rem; color:var(--text-dim); margin-top:5px;">Extra Cash: ${o.releaseFee}M</div>
                    <button class="accept-btn" style="background:var(--gold); color:black;" onclick="acceptTrade('${o._id}')">CONFIRM SWAP</button>
                </div>`;
            } 
            // IF THE OFFER IS A REGULAR TRANSFER (DEFAULT)
            else {
                return `
                <div class="offer-card">
                    <div style="font-size:0.8rem; margin-bottom:5px;"><b>${o.fromTeam}</b> sent offer for:</div>
                    <div style="font-weight:700; font-size:1.1rem; color:white;">${o.playerName}</div>
                    <div style="font-size:0.7rem; color:var(--text-dim); margin-top:5px;">Fee: ${o.releaseFee}M</div>
                    <button class="accept-btn" onclick="acceptOffer('${o._id}')">CONFIRM SIGNING (${o.releaseFee}M)</button>
                </div>`;
            }
        }).join('');
    } else {
        document.getElementById('offersBox').style.display = 'none';
    }
        }

        async function acceptOffer(id) {
            if(!confirm("Are you sure you want to finalize this signing?")) return;
            const res = await fetch(`${API}/api/market/accept-offer`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ listingId: id, buyerTeamName: teamName })
            });
            if(res.ok) { alert("Transfer Complete! ✅"); location.reload(); }
            else { const err = await res.json(); alert(err.error); }
        }

        async function publishListing() {
            const feeInput = document.getElementById('fee').value;
            const playerInput = document.getElementById('playerList').value;
            const targetInput = document.getElementById('targetTeam').value;
            const addonsInput = document.getElementById('addons').value;

            if(!feeInput || !playerInput) return alert("Select player and fee!");

            const res = await fetch(`${API}/api/market/list-player`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    playerName: playerInput,
                    fromTeam: teamName,
                    releaseFee: feeInput,
                    addons: addonsInput,
                    targetTeam: targetInput
                })
            });
            
            if(res.ok) {
                alert("✅ Listing successfully published to the market!");
                location.reload();
            } else {
                alert("❌ Error: Check your purse balance or player status.");
            }
        }

        window.onload = init;
        // Tab Switching
function showTab(type) {
    if(type === 'transfer') {
        document.getElementById('transferPanel').style.display = 'block';
        document.getElementById('tradePanel').style.display = 'none';
        document.getElementById('btnTabTrans').style.background = 'var(--accent)';
        document.getElementById('btnTabTrade').style.background = 'var(--card)';
    } else {
        document.getElementById('transferPanel').style.display = 'none';
        document.getElementById('tradePanel').style.display = 'block';
        document.getElementById('btnTabTrans').style.background = 'var(--card)';
        document.getElementById('btnTabTrade').style.background = 'var(--gold)';
    }
}

// Publish Trade
async function publishTrade() {
    const payload = {
        fromTeam: teamName,
        myPlayer: document.getElementById('myTradePlayer').value,
        targetTeam: document.getElementById('tradeTargetTeam').value,
        targetPlayer: document.getElementById('targetTradePlayer').value,
        cashOffer: document.getElementById('tradeCash').value,
        addons: document.getElementById('tradeAddons').value,
        isPublic: document.getElementById('tradeVisibility').value === 'public'
    };

    if(!payload.targetPlayer) return alert("Select the player you want to swap for!");

    const res = await fetch(`${API}/api/market/list-trade`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    
    if(res.ok) { alert("Trade Proposed! ✅"); location.reload(); }
}

async function acceptTrade(id) {
    const res = await fetch(`${API}/api/market/accept-trade`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ listingId: id, acceptorTeam: teamName })
    });
    if(res.ok) { alert("Swap Success! Players updated. ✅"); location.reload(); }
}
        async function loadTargetTeamPlayers(tName) {
    if(!tName) return;
    const targetPlayerSelect = document.getElementById('targetTradePlayer');
    targetPlayerSelect.innerHTML = '<option>Loading Players...</option>';
    
    try {
        const res = await fetch(`${API}/api/teams/players/${encodeURIComponent(tName)}`);
        const players = await res.json();
        targetPlayerSelect.innerHTML = players.map(p => 
            `<option value="${p.name}">${p.name}</option>`
        ).join('');
    } catch (e) {
        targetPlayerSelect.innerHTML = '<option>Error loading players</option>';
    }
        }
    </script>
</body>
