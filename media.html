<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA HUB | NEXUS LEGENDS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap');

        :root { --bg: #020617; --accent: #10b981; --border: #1e293b; --card: #0f172a; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 20px; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-family: 'Orbitron'; letter-spacing: 5px; color: var(--accent); text-transform: uppercase; margin: 0; }
        .header p { font-size: 0.8rem; color: #64748b; letter-spacing: 3px; }

        /* Main Theater Frame */
        .theater-mode { 
            width: 100%; max-width: 900px; margin: 0 auto 50px; 
            background: var(--card); border: 1px solid var(--border);
            padding: 10px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .video-container { 
            position: relative; width: 100%; padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            border-radius: 15px; overflow: hidden; background: #000;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Video List Grid */
        .media-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; max-width: 1000px; margin: auto;
        }
        .video-card { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 18px; padding: 12px; transition: 0.3s; cursor: pointer;
        }
        .video-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .thumb-wrap { width: 100%; border-radius: 10px; overflow: hidden; position: relative; }
        .thumb-wrap img { width: 100%; display: block; }
        .play-btn { 
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.4); opacity: 0; transition: 0.3s;
        }
        .video-card:hover .play-btn { opacity: 1; }
        .video-card h3 { font-size: 0.95rem; margin: 12px 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .category-tag { font-size: 0.65rem; background: rgba(16, 185, 129, 0.1); color: var(--accent); padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>NEXUS <span style="color:white">MEDIA</span></h1>
        <p>REPLAYS • LIVE STREAMS • HIGHLIGHTS</p>
    </div>

    <!-- MAIN THEATER -->
    <div class="theater-mode" id="mainTheater" style="display:none;">
        <div class="video-container">
            <iframe id="mainFrame" src="" allowfullscreen></iframe>
        </div>
        <div style="padding:15px;">
            <span class="category-tag" id="mainCat">FEATURED</span>
            <h2 id="mainTitle" style="margin:10px 0 0; font-family:'Orbitron'; font-size:1.1rem;">VIDEO TITLE</h2>
        </div>
    </div>

    <div class="media-grid" id="videoGrid">
        <!-- Videos will load here -->
    </div>

    <script>
        const API = "https://nexus-database-v2.onrender.com";

        // Function to extract YouTube ID and make it embeddable
        function getEmbedUrl(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            const id = (match && match[2].length == 11) ? match[2] : null;
            return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
        }

        async function loadVideos() {
            const res = await fetch(`${API}/api/media/all`);
            const videos = await res.json();

            if(videos.length > 0) {
                // Load first video into theater
                playVideo(videos[0].youtubeUrl, videos[0].title, videos[0].category);
                document.getElementById('mainTheater').style.display = 'block';

                // Load rest into grid
                document.getElementById('videoGrid').innerHTML = videos.map(v => {
                    const id = v.youtubeUrl.match(/v=([^&]+)/)[1] || v.youtubeUrl.split('/').pop();
                    const thumb = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
                    
                    return `
                        <div class="video-card" onclick="playVideo('${v.youtubeUrl}', '${v.title}', '${v.category}')">
                            <div class="thumb-wrap">
                                <img src="${thumb}">
                                <div class="play-btn"><i class="fa-solid fa-play fa-2x" style="color:var(--accent)"></i></div>
                            </div>
                            <h3>${v.title}</h3>
                            <span class="category-tag">${v.category}</span>
                        </div>
                    `;
                }).join('');
            }
        }

        function playVideo(url, title, cat) {
            document.getElementById('mainFrame').src = getEmbedUrl(url);
            document.getElementById('mainTitle').innerText = title;
            document.getElementById('mainCat').innerText = cat;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        loadVideos();
    </script>
</body>
</html>
